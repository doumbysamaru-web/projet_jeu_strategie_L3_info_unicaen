# Paramètres du jeu de stratégie.
# Une clé absente ou vide garde la valeur par défaut de la classe jeu.modele.config.Parametres.

# Grille
largeur = 12
hauteur = 10
# remplissage : aleatoire ou arene
remplissage = aleatoire
densiteMurs = 0.12
nbPastilles = 6
valeurPastille = 15

# Combattants (valeurs de référence)
# equilibre = valeurs de référence, tank = +60 % d'énergie et moitié moins de munitions,
# artilleur = -30 % d'énergie et deux fois plus de munitions
energieInitiale = 60
munitionsMines = 3
munitionsBombes = 3
munitionsTirs = 6

# Coûts en énergie
coutDeplacement = 1
coutBouclier = 3
coutTir = 1
coutPose = 1

# Dégâts
degatsTir = 12
degatsMine = 20
degatsBombe = 18

# Armes : un tir touche à une distance strictement inférieure à porteeTir
porteeTir = 5
delaiBombe = 2

# Déroulement
# ordre : fixe ou aleatoire
ordre = aleatoire
toursMax = 300
# graine vide = parties toutes différentes
graine =

# Joueurs : nom:type:strategie séparés par des ;
# types : equilibre, tank, artilleur / stratégies : aleatoire, chasseur, prudent
#joueurs = :tank:chasseur; Bravo:artilleur:prudent; Charlie:equilibre:aleatoire; Delta:equilibre:chasseur
joueurs = Saliou:tank:chasseur; Amara:artilleur:prudent; Yacou:equilibre:chasseur; Fatou:equilibre:chasseur
